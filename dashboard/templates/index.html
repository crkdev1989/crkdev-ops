{% extends "base.html" %}
{% block title %}CRK Dev | Ops Dashboard{% endblock %}
{% block content %}
<main class="max-w-7xl mx-auto p-4">
  <header class="card mb-4 flex flex-col md:flex-row md:justify-between md:items-center">
    <h1 class="text-2xl font-bold">CRK Dev | Ops Dashboard</h1>
    <div id="live-clock" class="metrics text-lg"></div>
  </header>

  <section
    id="dashboard-body"
    hx-get="/partials/dashboard"
    hx-trigger="load, every 10s"
    hx-swap="innerHTML"
  >
    {% include "_dashboard_content.html" %}
  </section>
</main>

<dialog id="restart-modal" class="p-6 rounded-xl bg-[#0b1326] text-white border border-slate-700">
  <p id="restart-text" class="mb-4"></p>
  <div class="flex gap-2">
    <button class="btn danger" id="restart-confirm">Restart</button>
    <button class="btn" onclick="document.getElementById('restart-modal').close()">Cancel</button>
  </div>
</dialog>

<script>
  function confirmRestart(niche) {
    const modal = document.getElementById("restart-modal");
    document.getElementById("restart-text").textContent = `Restart scraper for ${niche}?`;
    document.getElementById("restart-confirm").onclick = async () => {
      const res = await fetch(`/api/restart/${niche}`, { method: "POST" });
      const data = await res.json();
      showToast(data.ok ? data.message : "Restart failed");
      modal.close();
    };
    modal.showModal();
  }
</script>
{% endblock %}
